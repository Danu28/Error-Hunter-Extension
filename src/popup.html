<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error Hunter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <h1 class="title">Error Hunter</h1>
      <div class="status-indicator" id="statusIndicator"></div>
    </header>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-start" id="btnStart">Start Monitoring</button>
      <button class="btn btn-stop" id="btnStop" hidden>Stop Monitoring</button>
      <button class="btn btn-clear" id="btnClear">Clear</button>
      <button class="btn btn-export" id="btnExport">Export HTML</button>
      <button class="btn btn-json" id="btnExportJson">JSON</button>
      <button class="btn btn-copy-selected" id="btnBugReport">Copy Report</button>
      <button class="btn btn-file-bug" id="btnFileBug">Edit Report</button>
    </div>

    <!-- Filter tabs -->
    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="console">Console</button>
      <button class="filter-btn" data-filter="warning">Warning</button>
      <button class="filter-btn" data-filter="network">Network</button>
    </div>

    <!-- Search input -->
    <div class="search-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="Search errors...">
    </div>

    <!-- Ignore rules -->
    <div class="rules-bar">
      <button class="rules-toggle" id="rulesToggle">Ignore rules</button>
    </div>
    <div class="rules-panel" id="rulesPanel" hidden>
      <div class="rules-add">
        <input type="text" class="rule-input" id="rulePattern" placeholder="Pattern to ignore (message or url)...">
        <select class="rule-match" id="ruleMatchOn">
          <option value="any">any</option>
          <option value="message">message</option>
          <option value="url">url</option>
        </select>
        <button class="btn btn-add-rule" id="btnAddRule">Add</button>
      </div>
      <div class="rules-list" id="rulesList"></div>
      <div class="rules-blocked" id="rulesBlocked"></div>
    </div>

    <!-- Error count summary -->
    <div class="summary" id="summary">
      <span id="errorCount">0 errors</span>
      <select class="tab-filter" id="tabFilter" hidden>
        <option value="">All tabs</option>
      </select>
      <button class="sort-toggle" id="sortToggle">↓ Newest</button>
      <a href="#" class="expand-toggle" id="expandToggle">Expand all</a>
    </div>

    <!-- Error list -->
    <div class="error-list" id="errorList">
      <div class="empty-state">No errors captured yet.<br>Click "Start Monitoring" to begin.</div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>Errors persist across navigations until cleared.</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
